app = "diagram-zip-mermaid"
primary_region = "dfw"

[build]
  image = "yuzutech/kroki-mermaid:0.32.1"

[http_service]
  internal_port = 8002
  force_https = false
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 6
    hard_limit = 10

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
