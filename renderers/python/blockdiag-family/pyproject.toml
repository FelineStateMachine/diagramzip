[project]
name = "diagramzip-blockdiag-family"
version = "0.1.0"
description = "Direct Cloudflare Python Worker renderer for the BlockDiag family"
requires-python = ">=3.13"
dependencies = [
  "defusedxml>=0.7.1,<0.8",
  "funcparserlib>=1.0.1,<2",
  "pillow>=11.3,<12",
  "webcolors>=25.10,<26",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "workers-py",
  "workers-runtime-sdk",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
