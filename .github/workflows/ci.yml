name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            diagramzip-api/package-lock.json
            diagramzip-docs/package-lock.json
            diagramzip-render/package-lock.json
            diagramzip-shell/package-lock.json

      - name: Install workspace dependencies
        run: |
          npm ci
          npm ci --prefix diagramzip-api
          npm ci --prefix diagramzip-docs
          npm ci --prefix diagramzip-render
          npm ci --prefix diagramzip-shell

      - name: Test editor
        run: npm run test:diagramzip

      - name: Build editor
        run: npm run build:diagramzip

      - name: Build documentation
        run: npm run build:diagramzip-docs

      - name: Test persistence API
        run: npm test --prefix diagramzip-api

      - name: Test renderer plane
        run: npm test --prefix diagramzip-render

      - name: Test shell
        run: npm test --prefix diagramzip-shell
