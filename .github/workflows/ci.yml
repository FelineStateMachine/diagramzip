name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/docs/package-lock.json
            renderers/edge/package-lock.json
            workers/api/package-lock.json
            workers/shell/package-lock.json

      - name: Install workspace dependencies
        run: |
          npm ci
          npm ci --prefix apps/docs
          npm ci --prefix renderers/edge
          npm ci --prefix workers/api
          npm ci --prefix workers/shell

      - name: Test editor
        run: npm run test:diagramzip

      - name: Build editor
        run: npm run build:diagramzip

      - name: Build documentation
        run: npm run build:diagramzip-docs

      - name: Test persistence API
        run: npm test --prefix workers/api

      - name: Test renderer plane
        run: npm test --prefix renderers/edge

      - name: Test shell
        run: npm test --prefix workers/shell
