name: diagram.zip Docs

on:
  push:
    branches:
      - main
    paths:
      - 'diagramzip-docs/**'
      - 'diagramzip/src/diagram-types.js'
      - 'diagramzip/src/main.js'
      - 'diagramzip-render/src/catalog.ts'
      - 'diagramzip-render/src/types.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/diagramzip-docs.yml'
  pull_request:
    paths:
      - 'diagramzip-docs/**'
      - 'diagramzip/src/diagram-types.js'
      - 'diagramzip/src/main.js'
      - 'diagramzip-render/src/catalog.ts'
      - 'diagramzip-render/src/types.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/diagramzip-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build diagram.zip docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install docs dependencies
        working-directory: diagramzip-docs
        run: npm ci

      - name: Build docs
        working-directory: diagramzip-docs
        run: npm run build
