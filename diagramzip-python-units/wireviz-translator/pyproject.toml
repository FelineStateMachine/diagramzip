[project]
name = "diagramzip-wireviz-translator"
version = "0.1.0"
description = "WireViz YAML to DOT Cloudflare Python Worker"
requires-python = ">=3.13"
dependencies = [
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "workers-py", "workers-runtime-sdk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
