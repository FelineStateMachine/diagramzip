app = "diagram-zip"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  KROKI_SAFE_MODE = "secure"
  KROKI_COMMAND_TIMEOUT = "30s"
  KROKI_DELEGATE_TIMEOUT_MS = "90000"
  KROKI_MAX_URI_LENGTH = "16384"
  KROKI_RENDER_CACHE_MAX_BYTES = "67108864"
  KROKI_RENDER_CACHE_TTL_SECONDS = "1800"
  KROKI_MERMAID_HOST = "diagram-zip-mermaid.flycast"
  KROKI_MERMAID_PORT = "80"
  KROKI_BPMN_HOST = "diagram-zip-bpmn.flycast"
  KROKI_BPMN_PORT = "80"
  KROKI_EXCALIDRAW_HOST = "diagram-zip-excalidraw.flycast"
  KROKI_EXCALIDRAW_PORT = "80"
  KROKI_DIAGRAMSNET_HOST = "diagram-zip-diagramsnet.flycast"
  KROKI_DIAGRAMSNET_PORT = "80"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 30

  [[http_service.checks]]
    grace_period = "45s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
